# tests/testdata/env_contract/.claude/pipeline.conf
#
# Fixture pipeline.conf for m27.3 env-contract parity test
# (tests/test_stage_env_setu.sh).
#
# Goal: exercise every code path the StageEnvV1 contract reaches, without
# performing real agent work. Every key here is intentionally minimal — the
# point of this fixture is to drive `tekhton run-stage` for each stage in
# internal/runner/single.go:defaultStageOrder() and verify the bash
# subprocesses survive `set -u` regardless of which subset of the env
# contract the runner populates.

# --- Project identity ---------------------------------------------------------
PROJECT_NAME="m27test-fixture"
PROJECT_DESCRIPTION="env-contract parity test fixture"

# --- Stage commands -----------------------------------------------------------
# `true` succeeds instantly with no output. The parity test never inspects
# build / test outcomes — only stage subprocess sourcing — so a no-op is
# strictly preferable to a real command.
ANALYZE_CMD="true"
BUILD_CHECK_CMD="true"
TEST_CMD="true"

# --- Models (required by internal/config:requiredKeys) -----------------------
CLAUDE_STANDARD_MODEL="claude-sonnet-4-6"

# --- Tooling ------------------------------------------------------------------
# `bash` is universally available; listing it as the only required tool keeps
# preflight from spuriously failing on a thin test container.
REQUIRED_TOOLS="bash"

# --- Files --------------------------------------------------------------------
ARCHITECTURE_FILE="ARCHITECTURE.md"
PROJECT_RULES_FILE="CLAUDE.md"

# --- Turn limits (kept small so any accidental agent invocation halts fast) --
CODER_MAX_TURNS=2
JR_CODER_MAX_TURNS=2
REVIEWER_MAX_TURNS=2
TESTER_MAX_TURNS=2
SCOUT_MAX_TURNS=2

# --- Pipeline behavior --------------------------------------------------------
MAX_REVIEW_CYCLES=1
MILESTONE_DAG_ENABLED=true
MILESTONE_DIR=".claude/milestones"
MILESTONE_MANIFEST="MANIFEST.cfg"
